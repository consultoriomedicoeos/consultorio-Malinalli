<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Médico Malinalli</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333333;
            --card-bg: #ffffff;
            --primary-color: #1b4332;
            --secondary-color: #2d6a4f;
            --accent-color: #d8f3dc;
            --border-color: #ccc;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --primary-color: #52b788;
            --secondary-color: #40916c;
            --accent-color: #1b4332;
            --border-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin: 0;
        }

        .theme-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .theme-btn:hover {
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"],
        input[type="email"],
        input[type="datetime-local"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea {
            resize: vertical;
        }

        .btn-main {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-main:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Consultorio Médico Malinalli</h1>
        <button class="theme-btn" onclick="toggleTheme()">🌙 Cambiar Tema</button>
    </header>

    <div class="container">
        <h2 style="color: var(--primary-color); margin-top: 0;">Agendar Cita Médica</h2>
        <p style="margin-bottom: 25px; opacity: 0.8;">Rellena los datos de forma sencilla para agendar tu consulta.</p>

        <!-- Formulario configurado con target hacia el iframe oculto -->
        <form id="appointmentForm" action="https://script.google.com/macros/s/AKfycbzuqzFcHUkHpTZtHUXkMi2csqdioRcc8ZPqRhvCsFcPvBMlrT-lacjDEhPHYBGL5p0cSA/exec" method="POST" target="hidden_iframe" onsubmit="enviarCitaWhatsApp(event)">
            
            <div class="form-group">
                <label for="nombre">Nombre Completo del Paciente:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej. María López Pérez">
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" required placeholder="Ej. 45">
            </div>

            <div class="form-group">
                <label for="telefono">Número Telefónico (WhatsApp):</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 55 1234 5678">
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required placeholder="Ej. correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="motivo">Motivo de la Cita:</label>
                <textarea id="motivo" name="motivo" rows="3" required placeholder="Ej. Dolor de cabeza frecuente..."></textarea>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha y Hora de la Cita:</label>
                <input type="datetime-local" id="fecha" name="fecha" required>
            </div>

            <!-- Campo oculto requerido por tu Google Sheet -->
            <input type="hidden" name="ultimaCita" value="Primera vez">

            <button type="submit" class="btn-main">Confirmar y Enviar Cita</button>
        </form>

        <!-- Iframe invisible para procesar la respuesta del script de Google sin errores de CORS -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="mostrarAlertaExito()"></iframe>
    </div>

    <script>
        let formularioEnviado = false;

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function enviarCitaWhatsApp(event) {
            formularioEnviado = true;
            
            const nombre = document.getElementById('nombre').value;
            const edad = document.getElementById('edad').value;
            const telefono = document.getElementById('telefono').value;
            const correo = document.getElementById('correo').value;
            const motivo = document.getElementById('motivo').value;
            const fechaHora = document.getElementById('fecha').value;

            if(fechaHora) {
                const fechaObj = new Date(fechaHora);
                const fechaFmt = fechaObj.toLocaleDateString();
                const horaFmt = fechaObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                // ⚠️ Reemplaza '521XXXXXXXXXX' por tu número con lada internacional (ej. 521 para México + 10 dígitos)
                const tuNumeroWhatsApp = "5213541472048"; 
                
                const mensaje = `Hola, nueva cita registrada:%0A%0A*Nombre:* ${nombre}%0A*Edad:* ${edad} años%0A*Teléfono:* ${telefono}%0A*Correo:* ${correo}%0A*Motivo:* ${motivo}%0A*Fecha y Hora:* ${fechaFmt} a las ${horaFmt}`;
                
                window.open(`https://wa.me/${tuNumeroWhatsApp}?text=${mensaje}`, '_blank');
            }
        }

        function mostrarAlertaExito() {
            if(formularioEnviado) {
                alert('¡Cita registrada con éxito en el sistema!');
                document.getElementById('appointmentForm').reset();
                formularioEnviado = false;
            }
        }
    </script>
</body>
</html>
